# 증분(incremental) 업데이트: 최근 2~3개월만 다시 받고 나머지는 캐시 재사용
# 매일 한국시간 오전 6시 자동 실행 (Actions 탭에서 수동 실행도 가능)

name: Update Real Estate Data (Incremental)

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 한국시간 06:00
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: 매매 데이터 증분 수집 (최근 3개월만 갱신)
        working-directory: api-integration
        run: python fetch_molit_incremental.py

      - name: 전세 데이터 증분 수집 (최근 2개월만 갱신)
        working-directory: api-integration
        run: python fetch_jeonse_incremental.py

      - name: data.js 병합
        working-directory: api-integration
        run: |
          cp ../data.js .
          python merge_into_datajs.py
          cp data.js ../data.js

      - name: 변경사항 커밋 (data.js + 캐시 파일)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js api-integration/molit_cache.json api-integration/jeonse_cache.json
          git diff --cached --quiet || git commit -m "chore: 실거래가 증분 업데이트 ($(date +'%Y-%m-%d %H:%M'))"
          git push
