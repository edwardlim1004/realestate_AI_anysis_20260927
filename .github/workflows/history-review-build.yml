name: Build Seoul Gyeonggi History Review
on:
  push:
    branches: [codex/seoul-gyeonggi-history-review]
    paths:
      - "seoul-apartment-collector/build_metro_history.py"
      - ".github/workflows/history-review-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  summary:
    strategy:
      fail-fast: false
      matrix:
        city: [seoul, gyeonggi, daejeon]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install archive dependencies
        run: python -m pip install boto3 google-api-python-client google-auth cryptography
      - name: Verify summary and storage rules
        run: python -m unittest discover -s seoul-apartment-collector -p 'test_metro_history.py' -v
      - name: Publish verified metro price summaries
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python seoul-apartment-collector/build_metro_history.py --city "${{ matrix.city }}" --workers 8
          git add -f dashboard-v1/data/metro-history/${{ matrix.city }}-*.json.gz dashboard-v1/data/metro-history/index-${{ matrix.city }}.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish monthly metro history and contracts"
            # Push only to the review branch. Never write or merge main.
            for attempt in 1 2 3 4; do
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}"
              if git push origin "HEAD:refs/heads/${{ github.ref_name }}"; then break; fi
              if [ "$attempt" = 4 ]; then exit 1; fi
            done
          fi
      - name: Preserve generated review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-review-${{ matrix.city }}
          retention-days: 14
          path: dashboard-v1/data/metro-history/${{ matrix.city }}-*.json.gz
