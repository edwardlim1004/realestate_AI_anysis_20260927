name: Busan Daegu Gwangju Sequential Apartment Archives
on:
  push:
    branches: [main]
    paths:
      - "seoul-apartment-collector/metro_queue.py"
      - ".github/workflows/metro-apartment-history.yml"
  schedule:
    - cron: "10 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seoul-apartment-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing storage dependencies
        run: python -m pip install boto3 google-api-python-client google-auth google-auth-oauthlib cryptography
      - name: Collect serial queue with shared quota and storage guards
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          R2_GDRIVE_FALLBACK_ENABLED: "true"
          R2_STORAGE_SOFT_CAP_BYTES: "8000000000"
          R2_USAGE_ACCESS_KEY_ID: ${{ secrets.R2_USAGE_ACCESS_KEY_ID }}
          R2_USAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_USAGE_SECRET_ACCESS_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in 1 2 3 4; do
            result=0
            python seoul-apartment-collector/metro_queue.py --max-requests 200 || result=$?
            python seoul-apartment-collector/metro_queue.py --report-only
            git add seoul-apartment-collector/r2_manifest.json seoul-apartment-collector/state.json seoul-apartment-collector/status.json seoul-apartment-collector/updates/
            git add seoul-apartment-collector/metro_progress.json
            for city in busan daegu gwangju; do
              for kind in audit source verified; do
                file="seoul-apartment-collector/${city}_metro_${kind}.json"
                if [ -f "$file" ]; then git add "$file"; fi
              done
            done
            for file in seoul-apartment-collector/*_metro_audit_scopes.jsonl.gz; do
              if [ -f "$file" ]; then git add -f "$file"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "data: sequential metro archive checkpoint"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
            if [ "$result" -ne 0 ]; then exit "$result"; fi
          done
      - name: Preserve audit evidence on every result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-archive-audit-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            seoul-apartment-collector/metro_progress.json
            seoul-apartment-collector/*_metro_*.json
            seoul-apartment-collector/*_metro_audit_scopes.jsonl.gz
            seoul-apartment-collector/state.json
            seoul-apartment-collector/status.json
