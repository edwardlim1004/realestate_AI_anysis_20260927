name: Update Official Housing Risk Monitor

on:
  schedule:
    - cron: "15 23 * * 0" # Monday 08:15 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: official-housing-risk-monitor
  cancel-in-progress: false

jobs:
  update-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HaR dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<0.16"

      - name: Upsert OECD and BIS official observations
        run: python risk-monitor/update_risk_data.py

      - name: Calculate real-data HaR backtest and validation
        run: |
          python -m unittest discover -s har -p "test_*.py"
          python har/build_har.py
          python har/validate_har.py
          python har/promote_if_validated.py

      - name: Commit only new or revised official observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risk-data.js risk-data/ har/results.json har/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update official housing risk indicators"
            git push origin HEAD:main
          else
            echo "No official data changes"
          fi
