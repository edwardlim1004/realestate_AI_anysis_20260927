name: Check Seoul and Gyeonggi Incremental Collector
on:
  pull_request:
    paths:
      - "seoul-apartment-collector/collect.py"
      - "seoul-apartment-collector/test_quota.py"
      - "seoul-apartment-collector/regions.py"
      - "seoul-apartment-collector/incremental.py"
      - "seoul-apartment-collector/test_incremental.py"
      - "seoul-apartment-collector/test_daejeon.py"
      - "seoul-apartment-collector/verify_daejeon_storage.py"
      - "seoul-apartment-collector/recover_failed_run.py"
      - "seoul-apartment-collector/recoveries/**"
      - "seoul-apartment-collector/test_recovery.py"
      - "seoul-apartment-collector/test_workflow_commit.py"
      - "seoul-apartment-collector/audit_storage.py"
      - "seoul-apartment-collector/test_audit_storage.py"
      - "seoul-apartment-collector/audit_region_history.py"
      - "seoul-apartment-collector/test_region_history.py"
      - "seoul-apartment-collector/complete_source_audit.py"
      - "seoul-apartment-collector/test_complete_source_audit.py"
      - ".github/workflows/complete-apartment-source-audit.yml"
      - ".github/workflows/audit-apartment-storage.yml"
      - ".github/workflows/seoul-apartment-history.yml"
      - ".github/workflows/check-seoul-collector.yml"
permissions:
  contents: read
jobs:
  quota-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python compilation
        run: python -m py_compile seoul-apartment-collector/collect.py seoul-apartment-collector/r2_bridge.py seoul-apartment-collector/test_quota.py
      - name: Test cap logic without external services or secrets
        run: |
          python seoul-apartment-collector/test_quota.py
          python seoul-apartment-collector/test_incremental.py
          python seoul-apartment-collector/test_recovery.py
          python seoul-apartment-collector/test_workflow_commit.py
          python seoul-apartment-collector/test_audit_storage.py
          python seoul-apartment-collector/test_region_history.py
          python seoul-apartment-collector/test_complete_source_audit.py
          python seoul-apartment-collector/test_daejeon.py

