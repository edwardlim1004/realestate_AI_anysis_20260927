name: Check Seoul Collector Quota
on:
  pull_request:
    paths:
      - "seoul-apartment-collector/collect.py"
      - "seoul-apartment-collector/test_quota.py"
      - ".github/workflows/check-seoul-collector.yml"
permissions:
  contents: read
jobs:
  quota-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python compilation
        run: python -m py_compile seoul-apartment-collector/collect.py seoul-apartment-collector/r2_bridge.py seoul-apartment-collector/test_quota.py
      - name: Test cap logic without external services or secrets
        run: python seoul-apartment-collector/test_quota.py
