name: HaR independent research update

on:
  pull_request:
    paths:
      - 'har/**'
      - '.github/workflows/har-research.yml'
  workflow_dispatch: {}
  schedule:
    - cron: "35 0 * * 1" # Monday 09:35 KST, after official risk-data refresh

permissions:
  contents: write

concurrency:
  group: har-research-update
  cancel-in-progress: false

jobs:
  build-har:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'statsmodels>=0.14,<0.16'
      - name: Run synthetic unit tests
        run: python -m unittest discover -s har -p 'test_*.py'
      - name: Run HaR model on official historical observations
        run: python har/build_har.py
      - name: Validate rolling backtest, calibration and vintage proof
        run: python har/validate_har.py
      - name: Confirm isolation
        run: |
          git diff --exit-code -- risk-data.js risk-data/risk_summary.json risk-data/risk_raw.csv
          python -c "import json; d=json.load(open('har/results.json')); assert d['composite_eligible'] is False and d['publication']=='RESEARCH_ONLY'"
      - name: Commit research artifact only
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add har/results.json har/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "data(har): update isolated research output"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
