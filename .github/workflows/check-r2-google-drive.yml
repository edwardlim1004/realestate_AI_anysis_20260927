name: Check Google Drive R2 Backup (No Secrets)
on:
  pull_request:
    paths:
      - "seoul-apartment-collector/google_drive_backup.py"
      - "seoul-apartment-collector/google_drive_oauth_local.py"
      - "seoul-apartment-collector/test_google_drive_backup.py"
      - "seoul-apartment-collector/r2_bridge.py"
      - "seoul-apartment-collector/r2_gdrive_failover.py"
      - "seoul-apartment-collector/test_storage_failover.py"
      - "seoul-apartment-collector/storage_usage.py"
      - "seoul-apartment-collector/storage_budget.py"
      - "seoul-apartment-collector/test_storage_budget.py"
      - "seoul-apartment-collector/test_storage_routing.py"
      - "gsadf/storage.py"
      - "seoul-apartment-collector/backfill_progress.py"
      - "seoul-apartment-collector/collect.py"
      - "seoul-apartment-collector/test_quota.py"
      - "seoul-apartment-collector/regions.py"
      - "seoul-apartment-collector/incremental.py"
      - "seoul-apartment-collector/test_incremental.py"
      - ".github/workflows/check-r2-google-drive.yml"
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile code
        run: python -m compileall -q seoul-apartment-collector/*.py
      - name: Exercise R2 checksum and idempotent Drive behavior without external access
        run: |
          python seoul-apartment-collector/test_google_drive_backup.py
          python seoul-apartment-collector/test_storage_failover.py
          python seoul-apartment-collector/test_quota.py
          python seoul-apartment-collector/test_incremental.py
          python seoul-apartment-collector/test_storage_budget.py
          python seoul-apartment-collector/test_storage_routing.py
