name: Check Google Drive R2 Backup (No Secrets)
on:
  pull_request:
    paths:
      - "seoul-apartment-collector/google_drive_backup.py"
      - "seoul-apartment-collector/google_drive_oauth_local.py"
      - "seoul-apartment-collector/test_google_drive_backup.py"
      - ".github/workflows/check-r2-google-drive.yml"
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile code
        run: python -m py_compile seoul-apartment-collector/google_drive_backup.py seoul-apartment-collector/google_drive_oauth_local.py seoul-apartment-collector/test_google_drive_backup.py
      - name: Exercise R2 checksum and idempotent Drive behavior without external access
        run: python seoul-apartment-collector/test_google_drive_backup.py
