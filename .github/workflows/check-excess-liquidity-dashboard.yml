name: Verify Excess Liquidity Research Dashboard
on:
  pull_request:
    branches: [main]
    paths:
      - "liquidity-research/**"
      - "risk-monitor/liquidity/update_asset_transmission.py"
      - ".github/workflows/update-liquidity-asset-transmission.yml"
      - "risk-monitor/liquidity/compare_excess_liquidity.py"
      - ".github/workflows/check-excess-liquidity-dashboard.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse dashboard and verify real ECOS points
        run: |
          node --check liquidity-research/app.js
          node --check liquidity-research/expanded.js
          node --test liquidity-research/tests/*.test.cjs
          python -m unittest discover -s liquidity-research/tests -p 'test_*.py' -v
      - name: Confirm source data never activate composite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('risk-monitor/liquidity/promotion.json').read_text())
          assert p['enabled'] is False
          print('SHADOW promotion OFF; no changes to composite calculations')
          PY
