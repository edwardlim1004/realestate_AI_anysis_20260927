name: Build Seoul + Gyeonggi Transaction Details (56 regions)

on:
  push:
    branches: [main]
    paths:
      - "seoul-apartment-collector/build_public_trade_details.py"
      - "seoul-apartment-collector/test_build_public_trade_details.py"
      - "apartment-trades.js"
      - ".github/workflows/build-public-trade-details.yml"
  schedule:
    - cron: "10 5 * * *" # 14:10 Korea; after collector and data.js refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: public-trade-details-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test transaction conversion and missing-source safety
        run: python -m unittest discover -s seoul-apartment-collector -p "test_build_public_trade_details.py" -v
      - name: Install existing R2 and Google Drive archive readers
        run: python -m pip install boto3 google-api-python-client google-auth google-auth-oauthlib cryptography
      - name: Generate detailed public snapshots from privately stored verified official scopes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python seoul-apartment-collector/build_public_trade_details.py
      - name: Verify published regions, no raw original JSON, and scope audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path("trade-details")
          index=json.loads((folder/"index.json").read_text())
          report=json.loads((folder/"build-report.json").read_text())
          ok=0
          for name,info in index["regions"].items():
              path=folder/info["file"]
              if not path.exists(): continue
              data=json.loads(path.read_text())
              assert data["schema"]==1 and data["region"]==name
              assert data["coverage"]["missing_scopes"]==0
              assert not any("원본항목JSON" in record for record in data["rows"])
              assert sum(data["by_month"].values())==len(data["rows"])
              ok+=1
          assert len(index["regions"])==56, len(index["regions"])
          assert ok>0, "No region has verified transaction rows"
          print("VERIFIED_SNAPSHOT_REGIONS",ok,"/56",report["summary"])
          PY
      - name: Commit ONLY compact verified public details; never publish private raw files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-details/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified Seoul/Gyeonggi recent apartment sale details"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
