name: Build Five-Year Apartment Transaction History

on:
  push:
    branches: [main]
    paths:
      - "seoul-apartment-collector/build_trade_history.py"
      - "seoul-apartment-collector/r2_manifest.json"
      - "seoul-apartment-collector/r2_bridge.py"
      - "seoul-apartment-collector/build_public_trade_details.py"
      - "api-integration/regions_lawd.py"
      - ".github/workflows/build-trade-history.yml"
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: five-year-trade-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verified archive readers
        run: python -m pip install boto3 google-api-python-client google-auth google-auth-oauthlib cryptography
      - name: Build five-year compressed public records from verified scopes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python seoul-apartment-collector/build_trade_history.py --months 60
      - name: Commit compressed public history and coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-details/history/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified five-year transaction history"
            bash scripts/push-generated.sh
          fi
