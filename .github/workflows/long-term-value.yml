name: Build Apartment Five-Year Valuations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "long-term-value/build_snapshots.py"
      - "long-term-value/model.js"
      - "long-term-value/index.html"
      - "long-term-value/test_build_snapshots.py"
      - ".github/workflows/long-term-value.yml"
  schedule:
    - cron: "10 23 * * *" # ~08:10 Asia/Seoul (GitHub may delay scheduled runs)
permissions:
  contents: write
concurrency:
  group: apartment-five-year-valuations
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private R2 SDK
        run: python -m pip install boto3
      - name: Verify offline valuation rules
        run: |
          python -m unittest discover -s long-term-value -p 'test_*.py' -v
          node --check long-term-value/model.js
          node -e "const m=require('./long-term-value/model.js'); if(m.addYears(100000,2)!==110408.08) process.exit(1)"
      - name: Build five-year district snapshots from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python long-term-value/build_snapshots.py
      - name: Commit only changed aggregate snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add long-term-value/data/
          if git diff --cached --quiet; then
            echo "No changes in source fingerprint; skip commit."
            exit 0
          fi
          git commit -m "chore: refresh five-year apartment valuation snapshots"
          git push origin HEAD:main
