name: Seoul Gyeonggi and Daejeon Apartment Collector (Safe)
on:
  push:
    branches: [main]
    paths:
      - "seoul-apartment-collector/collect.py"
      - "seoul-apartment-collector/regions.py"
      - "seoul-apartment-collector/incremental.py"
      - "seoul-apartment-collector/r2_bridge.py"
      - "seoul-apartment-collector/storage_usage.py"
      - "seoul-apartment-collector/storage_budget.py"
      - "seoul-apartment-collector/r2_gdrive_failover.py"
      - "seoul-apartment-collector/kakao_self_alert.py"
      - ".github/workflows/seoul-apartment-history.yml"
  schedule:
    - cron: "30 0,3,6,9,12,15,18,21 * * *" # KST 09:30/12:30/15:30/18:30/21:30/00:30/03:30/06:30
  workflow_dispatch:
    inputs:
      mode:
        description: "daily / test / backfill / refresh"
        required: false
        default: daily
        type: choice
        options: [daily, test, backfill, refresh]
      max_requests:
        description: "Request ceiling per run (1-1200)"
        required: false
        default: "1200"
        type: string
      region:
        description: "all / seoul / gyeonggi / daejeon (shared daily request budget)"
        required: false
        default: all
        type: choice
        options: [all, seoul, gyeonggi, daejeon]
permissions:
  contents: write
  issues: write
concurrency:
  group: seoul-apartment-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main # Shared quota/state must be read after the concurrency lock.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install R2 and Google Drive failover SDKs
        run: python -m pip install boto3 google-api-python-client google-auth google-auth-oauthlib cryptography
      - name: Require successful Seoul and Gyeonggi live verification before Daejeon
        env:
          REQUESTED_REGION: ${{ github.event.inputs.region || (github.event_name == 'push' && 'daejeon' || 'all') }}
        run: |
          python - <<'CHECK'
          import json,os
          from pathlib import Path
          if os.environ['REQUESTED_REGION'] in ('all','daejeon'):
              report=json.loads(Path('seoul-apartment-collector/coverage_audit.json').read_text())
              assert report['passed'] and report['storage_complete'], 'Seoul/Gyeonggi live audit needs review'
              for region,expected in [('seoul',11000),('gyeonggi',19062)]:
                  item=report['regions'][region]
                  assert item['expected_scopes']==expected and item['reread_verified_scopes']==expected
                  assert item['failed_scopes']==0
              print('CAPITAL_ARCHIVE_GATE_PASSED: all 30,062 scopes verified before Daejeon starts')
          CHECK
      - name: Recover verified results from failed run 39597380565 once
        id: recovery
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python seoul-apartment-collector/recover_failed_run.py
      - name: Collect official apartment data slowly
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          R2_GDRIVE_FALLBACK_ENABLED: "true"
          R2_STORAGE_SOFT_CAP_BYTES: "8000000000"
          REQUESTED_MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'test' || 'daily') }}
          REQUESTED_LIMIT: ${{ github.event.inputs.max_requests || (github.event_name == 'push' && '8' || '1200') }}
          REQUESTED_REGION: ${{ github.event.inputs.region || (github.event_name == 'push' && 'daejeon' || 'all') }}
          R2_USAGE_ACCESS_KEY_ID: ${{ secrets.R2_USAGE_ACCESS_KEY_ID }}
          R2_USAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_USAGE_SECRET_ACCESS_KEY }}
        run: |
          python seoul-apartment-collector/collect.py --mode "$REQUESTED_MODE" --region "$REQUESTED_REGION" --max-requests "$REQUESTED_LIMIT" --delay 3
      - name: Verify real Daejeon sale and rental collection after deployment
        if: github.event_name == 'push'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'seoul-apartment-collector')
          from r2_bridge import R2Storage
          from collect import prev,today
          base=Path('seoul-apartment-collector')
          status=json.loads((base/'status.json').read_text())
          manifest=json.loads((base/'r2_manifest.json').read_text())['files']
          assert status['last_run_mode']=='test', status
          assert status['last_run_success']==2 and status['last_run_failures']==0, status
          assert status['last_run_requests']>=2, status
          kinds={key.split('/')[0] for key in manifest if key.split('/')[2]=='30110'}
          assert {'sale','rent'} <= kinds, kinds
          archive=R2Storage()
          ym=prev(today().strftime('%Y%m'))
          rows={};rent_types={'jeonse':0,'monthly':0}
          for kind in ('sale','rent'):
              relative=archive.relpath(kind,'30110',ym)
              stored=archive.read_scope(relative)
              assert len(stored)==manifest[relative]['rows'], relative
              rows[kind]=len(stored)
              if kind=='rent':
                  from decimal import Decimal
                  from collect import row
                  for raw in stored:
                      value=Decimal(row(kind,'30110',ym,raw)['월세금(만원)'].replace(',',''))
                      rent_types['jeonse' if value==0 else 'monthly']+=1
          assert all(count>0 for count in rows.values()), rows
          assert all(count>0 for count in rent_types.values()), rent_types
          print('DAEJEON_LIVE_SMOKE_VERIFIED: stored bytes, SHA256, row counts, jeonse and monthly rent; '+json.dumps({'rows':rows,'rent_types':rent_types}))
          PY
      - name: Verify Gyeonggi historical collection resumes after recovery
        if: github.event_name == 'push' && steps.recovery.outputs.recovered == 'true'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          R2_GDRIVE_FALLBACK_ENABLED: "true"
          R2_STORAGE_SOFT_CAP_BYTES: "8000000000"
        run: |
          python seoul-apartment-collector/collect.py --mode backfill --region gyeonggi --max-requests 8 --delay 3
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('seoul-apartment-collector')
          status=json.loads((base/'status.json').read_text())
          receipt=json.loads((base/'recoveries/39597380565.receipt.json').read_text())
          assert status['last_run_mode']=='backfill', status
          assert 0 < status['last_run_requests'] <= 8, status
          assert status['last_run_failures']==0 and status['last_run_success']>0, status
          assert status['completed_by_region']['gyeonggi']>receipt['completed_by_region']['gyeonggi'], status
          print('GYEONGGI_BACKFILL_RESUMED_VERIFIED: '+json.dumps(status['completed_by_region']))
          PY
      - name: Audit verified source coverage (R2 or Google Drive, through 2026-10)
        if: always()
        id: backfill
        run: python seoul-apartment-collector/backfill_progress.py
      - name: Audit Gyeonggi historical coverage separately
        if: always()
        id: backfill_gyeonggi
        run: python seoul-apartment-collector/backfill_progress.py --region gyeonggi
      - name: Audit Daejeon historical coverage separately
        if: always()
        id: backfill_daejeon
        run: python seoul-apartment-collector/backfill_progress.py --region daejeon
      - name: Commit successful monthly results
        if: always() && steps.recovery.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seoul-apartment-collector/r2_manifest.json seoul-apartment-collector/state.json seoul-apartment-collector/status.json seoul-apartment-collector/backfill_progress.json seoul-apartment-collector/gyeonggi_backfill_progress.json seoul-apartment-collector/daejeon_backfill_progress.json seoul-apartment-collector/updates/ seoul-apartment-collector/recoveries/
          if ! git diff --cached --quiet; then
            git commit -m "data: Seoul Gyeonggi and Daejeon apartment incremental archives"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          else
            echo "No new data"
          fi
      - name: Continue initial Daejeon history in checkpointed batches
        if: github.event_name == 'push' && steps.backfill_daejeon.outputs.complete != 'true'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          R2_GDRIVE_FALLBACK_ENABLED: "true"
          R2_STORAGE_SOFT_CAP_BYTES: "8000000000"
          REQUESTED_MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'test' || 'daily') }}
          REQUESTED_LIMIT: ${{ github.event.inputs.max_requests || (github.event_name == 'push' && '8' || '1200') }}
          REQUESTED_REGION: ${{ github.event.inputs.region || (github.event_name == 'push' && 'daejeon' || 'all') }}
          R2_USAGE_ACCESS_KEY_ID: ${{ secrets.R2_USAGE_ACCESS_KEY_ID }}
          R2_USAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_USAGE_SECRET_ACCESS_KEY }}
        run: |
          for batch in $(seq 1 12); do
            python seoul-apartment-collector/collect.py --mode backfill --region daejeon --max-requests 200 --delay 3
            python seoul-apartment-collector/backfill_progress.py --region daejeon
            git add seoul-apartment-collector/r2_manifest.json seoul-apartment-collector/state.json seoul-apartment-collector/status.json seoul-apartment-collector/daejeon_backfill_progress.json seoul-apartment-collector/updates/
            if ! git diff --cached --quiet; then
              git commit -m "data: Daejeon apartment history checkpoint $batch"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
            if python - <<'CHECK'
          import json,sys
          from pathlib import Path
          base=Path('seoul-apartment-collector')
          progress=json.loads((base/'daejeon_backfill_progress.json').read_text())
          status=json.loads((base/'status.json').read_text())
          sys.exit(0 if progress['completed'] or status['requests_today']>=status['daily_cap'] or status['last_run_success']==0 else 1)
          CHECK
            then
              break
            fi
          done
      - name: Reread all Daejeon files once historical storage is complete
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          R2_GDRIVE_FALLBACK_ENABLED: "true"
          R2_STORAGE_SOFT_CAP_BYTES: "8000000000"
          REQUESTED_MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'test' || 'daily') }}
          REQUESTED_LIMIT: ${{ github.event.inputs.max_requests || (github.event_name == 'push' && '8' || '1200') }}
          REQUESTED_REGION: ${{ github.event.inputs.region || (github.event_name == 'push' && 'daejeon' || 'all') }}
          R2_USAGE_ACCESS_KEY_ID: ${{ secrets.R2_USAGE_ACCESS_KEY_ID }}
          R2_USAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_USAGE_SECRET_ACCESS_KEY }}
        run: |
          if python - <<'CHECK'
          import json,sys
          from pathlib import Path
          base=Path('seoul-apartment-collector')
          progress=json.loads((base/'daejeon_backfill_progress.json').read_text())
          previous=base/'daejeon_coverage_audit.json'
          passed=previous.exists() and json.loads(previous.read_text()).get('passed')
          sys.exit(0 if progress['completed'] and not passed else 1)
          CHECK
          then
            python seoul-apartment-collector/verify_daejeon_storage.py
          fi
      - name: Preserve final Daejeon progress and audit summary
        if: always() && steps.recovery.outcome == 'success'
        run: |
          git add seoul-apartment-collector/r2_manifest.json seoul-apartment-collector/state.json seoul-apartment-collector/status.json seoul-apartment-collector/daejeon_backfill_progress.json seoul-apartment-collector/updates/
          if [ -f seoul-apartment-collector/daejeon_coverage_audit.json ]; then
            git add seoul-apartment-collector/daejeon_coverage_audit.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: Daejeon verified apartment archive progress"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Create GitHub completion notification (only once)
        id: completion_issue
        if: steps.backfill.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="서울 아파트 실거래 과거자료 수집 완료 (2026-10)"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq '.[] | select(.title == "서울 아파트 실거래 과거자료 수집 완료 (2026-10)" and .pull_request == null) | .number' | head -n 1)"
          if [ -z "$existing" ]; then
            issue_url="$(gh issue create --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" --body "서울 25개 구 아파트 매매(2006-01~2026-10) 및 전월세(2011-01~2026-10)의 11,000개 지역·계약월 구간이 Cloudflare R2 업로드 완료 매니페스트에서 모두 확인됐습니다. 자세한 진행 내역은 seoul-apartment-collector/backfill_progress.json을 확인하세요. 원천 거래 누락·정정 여부를 별도로 검증하는 것은 남아 있습니다.")"
            existing="${issue_url##*/}"
          else
            echo "Completion Issue already exists: $existing"
          fi
          case "$existing" in
            ''|*[!0-9]*) echo "Invalid completion issue number"; exit 1 ;;
          esac
          echo "issue_number=$existing" >> "$GITHUB_OUTPUT"
      - name: Notify Kakao My Chat once after complete collection
        if: steps.backfill.outputs.complete == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KAKAO_COMPLETION_ISSUE_NUMBER: ${{ steps.completion_issue.outputs.issue_number }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -m pip install cryptography
          python seoul-apartment-collector/kakao_self_alert.py --mode complete
      - name: Keep sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-apt-report-${{ github.run_id }}
          path: |
            seoul-apartment-collector/state.json
            seoul-apartment-collector/status.json
            seoul-apartment-collector/r2_manifest.json
            seoul-apartment-collector/backfill_progress.json
            seoul-apartment-collector/gyeonggi_backfill_progress.json
            seoul-apartment-collector/daejeon_backfill_progress.json
            seoul-apartment-collector/daejeon_coverage_audit.json
            seoul-apartment-collector/daejeon_coverage_audit_scopes.jsonl.gz
            seoul-apartment-collector/updates/
            seoul-apartment-collector/recoveries/
          if-no-files-found: ignore
          retention-days: 30

