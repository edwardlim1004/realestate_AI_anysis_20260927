name: Seoul Apartment History Collector (Safe)
on:
  schedule:
    - cron: "30 0,3,6,9,12,15,18,21 * * *" # KST 09:30/12:30/15:30/18:30/21:30/00:30/03:30/06:30
  workflow_dispatch:
    inputs:
      mode:
        description: "daily / test / backfill / refresh"
        required: false
        default: daily
        type: choice
        options: [daily, test, backfill, refresh]
      max_requests:
        description: "Request ceiling per run (1-1200)"
        required: false
        default: "1200"
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: seoul-apartment-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install R2 S3 client
        run: python -m pip install boto3
      - name: Collect official apartment data slowly
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'daily' }}
          REQUESTED_LIMIT: ${{ github.event.inputs.max_requests || '1200' }}
        run: |
          python seoul-apartment-collector/collect.py --mode "$REQUESTED_MODE" --max-requests "$REQUESTED_LIMIT" --delay 3
      - name: Audit long-term Seoul coverage (2006/2011 to 2026-10)
        if: always()
        id: backfill
        run: python seoul-apartment-collector/backfill_progress.py
      - name: Commit successful monthly results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seoul-apartment-collector/r2_manifest.json seoul-apartment-collector/state.json seoul-apartment-collector/status.json seoul-apartment-collector/backfill_progress.json
          if ! git diff --cached --quiet; then
            git commit -m "data: Seoul apartment monthly archives"
            git push origin HEAD:main
          else
            echo "No new data"
          fi
      - name: Create GitHub completion notification (only once)
        if: steps.backfill.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="서울 아파트 실거래 과거자료 수집 완료 (2026-10)"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq '.[] | select(.title == "서울 아파트 실거래 과거자료 수집 완료 (2026-10)") | .number')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" --body "서울 25개 구 아파트 매매(2006-01~2026-10) 및 전월세(2011-01~2026-10)의 11,000개 지역·계약월 구간이 Cloudflare R2 업로드 완료 매니페스트에서 모두 확인됐습니다. 자세한 진행 내역은 seoul-apartment-collector/backfill_progress.json을 확인하세요. 원천 거래 누락·정정 여부를 별도로 검증하는 것은 남아 있습니다."
          else
            echo "Completion Issue already exists: $existing"
          fi
      - name: Notify Kakao My Chat once after complete collection
        if: steps.backfill.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -m pip install cryptography
          python seoul-apartment-collector/kakao_self_alert.py --mode complete
      - name: Keep sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-apt-report-${{ github.run_id }}
          path: |
            seoul-apartment-collector/state.json
            seoul-apartment-collector/status.json
          if-no-files-found: ignore
          retention-days: 30
