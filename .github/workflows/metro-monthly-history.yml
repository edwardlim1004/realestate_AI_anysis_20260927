name: Build Metro Monthly History
on:
  push:
    branches: [main]
    paths:
      - "seoul-apartment-collector/build_metro_history.py"
      - "seoul-apartment-collector/archive_reader.py"
      - ".github/workflows/metro-monthly-history.yml"
  workflow_run:
    workflows: ["Busan Daegu Gwangju Sequential Apartment Archives"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "45 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metro-monthly-history
  cancel-in-progress: false
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install archive dependencies
        run: python -m pip install boto3 google-api-python-client google-auth cryptography
      - name: Verify summary and storage rules
        run: python -m unittest discover -s seoul-apartment-collector -p 'test_metro_history.py' -v
      - name: Publish verified metro price summaries
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python seoul-apartment-collector/build_metro_history.py
          git add -f dashboard-v1/data/metro-history/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish monthly metro history and contracts"
            bash scripts/push-generated.sh
          fi
