name: Cloudflare R2 to Google Drive Backup
on:
  schedule:
    - cron: "20 23 * * *" # About 08:20 KST, daily, subject to GitHub scheduling delays
  workflow_dispatch:
    inputs:
      mode:
        description: "check=authentication only / sync=back up changed annual CSVs"
        required: true
        default: check
        type: choice
        options: [check, sync]
      max_years:
        description: "Max annual CSVs to upload in one run (1 to 24)"
        default: "12"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: r2-to-google-drive
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.GDRIVE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official SDK libraries
        run: python -m pip install boto3 google-api-python-client google-auth google-auth-oauthlib cryptography
      - name: Back up verified R2 scope data to owned Google Drive annual CSV files
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'sync' }}
          REQUESTED_YEARS: ${{ github.event.inputs.max_years || '12' }}
        run: |
          python seoul-apartment-collector/google_drive_backup.py --mode "$REQUESTED_MODE" --max-years "$REQUESTED_YEARS"
      - name: Preserve result metadata only (no sensitive credentials or full CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-backup-status-${{ github.run_id }}
          path: seoul-apartment-collector/google_drive_backup_report.json
          if-no-files-found: ignore
          retention-days: 14
