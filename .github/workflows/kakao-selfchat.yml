name: Kakao My Chat Message Test and Token Refresh
on:
  workflow_dispatch:
    inputs:
      action:
        description: "test: send explicit Kakao test message / refresh: token only"
        required: true
        default: test
        type: choice
        options: [test, refresh]
  schedule:
    - cron: "15 22 * * 0" # Weekly Sunday 22:15 UTC / Monday 07:15 KST
permissions:
  contents: read
concurrency:
  group: kakao-mychat-self-notify
  cancel-in-progress: false
jobs:
  kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kakao OAuth and R2 encryption clients
        run: python -m pip install boto3 cryptography
      - name: Refresh Kakao token or send explicitly requested test
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          REQUESTED_MODE: ${{ github.event.inputs.action || 'refresh' }}
        run: python seoul-apartment-collector/kakao_self_alert.py --mode "$REQUESTED_MODE"
