name: Audit Seoul and Gyeonggi Stored Apartment Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - seoul-apartment-collector/audit_storage.py
      - .github/workflows/audit-apartment-storage.yml
permissions:
  contents: write
concurrency:
  group: seoul-apartment-collector
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3 cryptography google-api-python-client google-auth google-auth-oauthlib
      - run: echo "SOURCE_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reread all stored Seoul and Gyeonggi scopes and check original empty scopes
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python seoul-apartment-collector/audit_storage.py --workers 16 --live-source
      - name: Save audit summary and shared official API request budget
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seoul-apartment-collector/coverage_audit.json seoul-apartment-collector/state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: live apartment storage integrity audit"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Keep per-scope audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apartment-storage-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            seoul-apartment-collector/coverage_audit.json
            seoul-apartment-collector/coverage_audit_scopes.jsonl.gz
          if-no-files-found: ignore
          retention-days: 30
